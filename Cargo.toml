[package]
name = "dynamic-wrapping"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust macros for monomorphized blanket implementations of dynamic traits"
repository = "https://github.com/thomasraskthomsen/dynamic-wrapping"
keywords = ["macro", "trait", "dispatch", "monomorphization", "wrapper"]
categories = ["rust-patterns", "development-tools::procedural-macro-helpers"]
rust-version = "1.70"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "parsing"] }
quote = "1"
proc-macro2 = "1"
